<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Affiche Facebook 1080x1080 · Promo Sirops Monin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Montserrat:wght@500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1080px;
  height: 1080px;
  overflow: hidden;
}
body {
  position: relative;
  background: #fbf7ef;
  font-family: 'Bricolage Grotesque', sans-serif;
}

/* ---------- Photo ---------- */
.photo {
  position: absolute;
  top: 0; left: 0;
  width: 1080px;
  height: 580px;
  object-fit: cover;
  object-position: center 62%;
}
.photo-fondu {
  position: absolute;
  top: 500px; left: 0;
  width: 1080px;
  height: 80px;
  background: linear-gradient(180deg, rgba(251,247,239,0) 0%, #fbf7ef 100%);
}

/* ---------- Pastille urgence ---------- */
.pill {
  position: absolute;
  top: 48px;
  right: 48px;
  background: #b3402e;
  color: #fdf6ee;
  font-weight: 800;
  font-size: 30px;
  letter-spacing: 2px;
  padding: 18px 34px;
  border-radius: 60px;
  transform: rotate(2.5deg);
  box-shadow: 0 10px 24px rgba(60,20,10,.28);
}

/* ---------- Zone texte ---------- */
.contenu {
  position: absolute;
  top: 596px;
  left: 64px;
  right: 64px;
}
.kicker {
  font-weight: 700;
  font-size: 25px;
  letter-spacing: 6px;
  color: #b3402e;
}
.titre {
  margin-top: 10px;
  font-weight: 800;
  font-size: 108px;
  line-height: 1;
  letter-spacing: -1px;
  color: #221d18;
}

/* ---------- Panneaux promo ---------- */
.panneaux {
  position: absolute;
  left: 64px;
  right: 64px;
  bottom: 96px;
  height: 230px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}
.pan {
  transform: skewX(-8deg);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 12px 26px rgba(60,40,20,.18);
}
.pan-in {
  transform: skewX(8deg);
  text-align: center;
  line-height: 1;
  color: #fff;
}
.pan-in b { display: block; font-weight: 800; }
.pan-in span {
  display: block;
  margin-top: 12px;
  font-weight: 600;
  font-size: 21px;
  letter-spacing: 3px;
  opacity: .95;
}
.p1 { width: 296px; height: 158px; background: #d64550; }
.p2 { width: 306px; height: 192px; background: #3f8f6b; }
.p3 { width: 322px; height: 226px; background: #c98a3d; }
.p1 b { font-size: 66px; }
.p2 b { font-size: 80px; }
.p3 b { font-size: 96px; }

/* ---------- Gouttes ---------- */
.goutte {
  position: absolute;
  border-radius: 50% 50% 50% 0;
  transform: rotate(45deg);
}
.g1 { width: 22px; height: 22px; background: #d64550; left: 706px;  top: 706px; }
.g2 { width: 16px; height: 16px; background: #3f8f6b; left: 1004px; top: 660px; }
.g3 { width: 19px; height: 19px; background: #c98a3d; left: 968px;  top: 610px; }

/* ---------- Pied ---------- */
.pied {
  position: absolute;
  bottom: 0; left: 0;
  width: 1080px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  border-top: 3px solid #4d6040;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 19px;
  letter-spacing: 1.5px;
  color: #4d6040;
}
.pied i {
  font-style: normal;
  color: #b3402e;
}
</style>
</head>
<body>
  <img class="photo" src="sirop monin img.jpg" alt="">
  <div class="photo-fondu"></div>

  <div class="pill">JUSQU'À DIMANCHE</div>

  <div class="contenu">
    <div class="kicker">LA SLOCHE EST ARRIVÉE · PLUS DE 20 SAVEURS</div>
    <div class="titre">Sirops Monin</div>
  </div>

  <div class="goutte g1"></div>
  <div class="goutte g2"></div>
  <div class="goutte g3"></div>

  <div class="panneaux">
    <div class="pan p1"><div class="pan-in"><b>-10%</b><span>1RE BOUTEILLE</span></div></div>
    <div class="pan p2"><div class="pan-in"><b>-20%</b><span>2E BOUTEILLE</span></div></div>
    <div class="pan p3"><div class="pan-in"><b>-30%</b><span>3E ET +</span></div></div>
  </div>

  <div class="pied">LE VIVIER · ÉPICERIE-BOUTIQUE <i>•</i> 14, AV. D'AMOURS, MATANE</div>
</body>
</html>
